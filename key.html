<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Complete - Your Key</title>
<style>
    body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #121212; color: #FFD700; }
    .key-box { font-size: 32px; font-weight: bold; margin-top: 20px; padding: 20px; border: 2px solid #FFD700; display: inline-block; border-radius: 10px; }
</style>
</head>
<body>

<h1>🎉 Task Complete!</h1>
<p>Copy this key and paste it in the app to unlock content:</p>
<div class="key-box" id="keyBox">Loading...</div>

<script>
// Read key from URL query parameter
const urlParams = new URLSearchParams(window.location.search);
const key = urlParams.get('key');

if(key){
    document.getElementById('keyBox').innerText = key;
} else {
    document.getElementById('keyBox').innerText = "Key not found!";
}
</script>

</body>
</html>
